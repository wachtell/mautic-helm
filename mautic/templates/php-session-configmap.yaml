apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "mautic.fullname" . }}-php-session
  labels:
    {{- include "mautic.labels" . | nindent 4 }}

data:
  # Mautic uses PHP's native session handler, which defaults to the
  # container's own /tmp. With several web pods a login made on one pod is
  # unknown on the next, so keep sessions on the shared var/ volume.
  # (The image has no phpredis, so Redis sessions aren't an option.)
  session.ini: |
    session.save_handler = files
    session.save_path = "{{ include "mautic.sessionPath" . }}"
