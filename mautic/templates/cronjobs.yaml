{{- if .Values.cron.enabled }}

{{- range .Values.cron.jobs }}

---
apiVersion: batch/v1
kind: CronJob

metadata:
  name: {{ include "mautic.fullname" $ }}-{{ .name }}
  labels:
{{- include "mautic.labels" $ | nindent 4 }}

spec:
  schedule: "{{ .schedule }}"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  timeZone: "Europe/Copenhagen"
  startingDeadlineSeconds: 300

  jobTemplate:
    metadata:
      labels:
{{- include "mautic.labels" $ | nindent 8 }}
        mautic-job: {{ .name }}

    spec:
      backoffLimit: 3
      
      template:
        spec:
          restartPolicy: OnFailure

          securityContext:
{{- include "mautic.wwwDataSecurityContext" $ | nindent 12 }}

          containers:
          - name: mautic-cron

            image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"

            command:
              - /bin/sh
              - -c
              - php /var/www/html/bin/console {{ .command }}

            envFrom:
            - configMapRef:
                name: {{ include "mautic.fullname" $ }}-config

            env:
{{- include "mautic.secretEnv" $ | nindent 12 }}
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_cron

            resources:
{{- toYaml ($.Values.cron.resources | default $.Values.resources) | nindent 14 }}

            volumeMounts:
            - name: mautic-media
              mountPath: /var/www/html/docroot/media

            - name: mautic-config
              mountPath: /var/www/html/config

            - name: mautic-data
              mountPath: /var/www/html/var

          volumes:
          - name: mautic-media
            persistentVolumeClaim:
              claimName: {{ include "mautic.mediaPVC" $ }}

          - name: mautic-config
            persistentVolumeClaim:
              claimName: {{ include "mautic.configPVC" $ }}

          - name: mautic-data
            persistentVolumeClaim:
              claimName: {{ include "mautic.dataPVC" $ }}

{{- end }}

---
# Deletes Symfony cache dirs left behind by previous image versions
# (see mautic.cachePath). Only dirs untouched for a day, so pods of the
# previous version mid-rollout are never affected.
apiVersion: batch/v1
kind: CronJob

metadata:
  name: {{ include "mautic.fullname" . }}-cache-prune
  labels:
{{- include "mautic.labels" . | nindent 4 }}

spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  timeZone: "Europe/Copenhagen"

  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never

          securityContext:
{{- include "mautic.wwwDataSecurityContext" . | nindent 12 }}

          containers:
          - name: cache-prune
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            command:
              - /bin/sh
              - -c
              - >-
                find {{ include "mautic.cacheRoot" . }} -mindepth 1 -maxdepth 1 -type d
                ! -name {{ base (include "mautic.cachePath" .) | quote }}
                -mmin +1440 -print -exec rm -rf {} +
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: mautic-data
              mountPath: /var/www/html/var

          volumes:
          - name: mautic-data
            persistentVolumeClaim:
              claimName: {{ include "mautic.dataPVC" . }}
{{- end }}