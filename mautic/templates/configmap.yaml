apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "mautic.fullname" . }}-config

data:

  MAUTIC_DB_HOST: {{ .Release.Name }}-mariadb

  MAUTIC_DB_USER: {{ .Values.mariadb.auth.username }}

  MAUTIC_DB_NAME: {{ .Values.mariadb.auth.database }}

  MAUTIC_DB_PORT: "3306"

  DOCKER_MAUTIC_ROLE: "mautic_web"

  MAUTIC_REDIS_HOST: {{ include "mautic.redisHost" . }}

  MAUTIC_REDIS_PORT: "6379"

  MAUTIC_REDIS_PRIMARY_ONLY: "false"

  # Cloudflare edges are proxies too when the site is served through Cloudflare
  MAUTIC_TRUSTED_PROXIES: {{ concat .Values.mautic.trustedProxies (.Values.cloudflare.enabled | ternary .Values.cloudflare.ipRanges list) | toJson | quote }}

  MAUTIC_TRUSTED_HOSTS: {{ .Values.mautic.trustedHosts | toJson | quote }}

  MAUTIC_BASE_URL: {{ printf "https://%s" .Values.ingressRoute.host | quote }}

  # var/ is shared across pods (RWX), so give each image version its own
  # Symfony cache dir; a new version never loads a container compiled by
  # the old one. Read by AppKernel::getCacheDir() via the local parameter bag.
  MAUTIC_CONFIG_PARAMETERS: {{ dict "cache_path" (include "mautic.cachePath" .) | toJson | quote }}