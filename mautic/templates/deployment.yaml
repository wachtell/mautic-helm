apiVersion: apps/v1

kind: Deployment

metadata:

  name: {{ include "mautic.fullname" . }}

  labels:

    {{- include "mautic.labels" . | nindent 4 }}


spec:

  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}


  selector:

    matchLabels:

      {{- include "mautic.selectorLabels" . | nindent 6 }}


  template:

    metadata:
      labels:

        {{- include "mautic.selectorLabels" . | nindent 8 }}
      
      annotations:
        {{- include "mautic.checksums" . | nindent 8 }}


    spec:

      initContainers:
        # Create dirs on the shared volumes as www-data before they're used:
        # PHP doesn't create session.save_path, and kubelet would create a
        # missing subPath dir as root. The volumes are mounted under /shared
        # here because the image declares VOLUMEs at media/images, media/files
        # and var/logs, which would otherwise shadow them in this container too.
        - name: prepare-shared-dirs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "mautic.wwwDataSecurityContext" . | nindent 12 }}
          command:
            - mkdir
            - -p
            - /shared/var/sessions
            - /shared/var/logs
            - /shared/media/images
            - /shared/media/files
            {{- if .Values.grapesjsAssets.enabled }}
            - {{ printf "/shared/var/%s" (include "mautic.grapesjsSubPath" .) | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: mautic-data
              mountPath: /shared/var
            - name: mautic-media
              mountPath: /shared/media

      containers:

        - name: mautic

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          {{- if .Values.migrations.enabled }}
          command:
            {{- include "mautic.webCommand" . | nindent 12 }}
          {{- end }}

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: {{ include "mautic.fullname" . }}-config

          env:
            {{- include "mautic.secretEnv" . | nindent 12 }}
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_web
                        
          volumeMounts:
            - name: mautic-media
              mountPath: /var/www/html/docroot/media
            # The image declares VOLUMEs for these; mount them explicitly or the
            # container runtime shadows them with per-pod local dirs
            - name: mautic-media
              mountPath: /var/www/html/docroot/media/images
              subPath: images
            - name: mautic-media
              mountPath: /var/www/html/docroot/media/files
              subPath: files

            - name: mautic-config
              mountPath: /var/www/html/config
            
            - name: mautic-data
              mountPath: /var/www/html/var
            - name: mautic-data
              mountPath: /var/www/html/var/logs
              subPath: logs

            - name: php-opcache
              mountPath: /usr/local/etc/php/conf.d/opcache.ini
              subPath: opcache.ini

            - name: php-session
              mountPath: /usr/local/etc/php/conf.d/zz-session.ini
              subPath: session.ini

            - name: apache-config
              mountPath: /etc/apache2/conf-enabled/zz-request-timing.conf
              subPath: zz-request-timing.conf

            {{- if .Values.grapesjsAssets.enabled }}
            # Filled by the grapesjs-assets job (image lacks the compiled builder)
            - name: mautic-data
              mountPath: /var/www/html/docroot/plugins/GrapesJsBuilderBundle/Assets/library/js/dist
              subPath: {{ include "mautic.grapesjsSubPath" . }}
              readOnly: true
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5

      volumes:
        - name: mautic-media
          persistentVolumeClaim:
            claimName: {{ include "mautic.mediaPVC" . }}

        - name: mautic-config
          persistentVolumeClaim:
            claimName: {{ include "mautic.configPVC" . }}
        
        - name: mautic-data
          persistentVolumeClaim:
            claimName: {{ include "mautic.dataPVC" . }}
        
        - name: php-opcache
          configMap:
            name: {{ include "mautic.fullname" . }}-php-opcache

        - name: php-session
          configMap:
            name: {{ include "mautic.fullname" . }}-php-session

        - name: apache-config
          configMap:
            name: {{ include "mautic.fullname" . }}-apache