apiVersion: apps/v1

kind: Deployment

metadata:

  name: {{ include "mautic.fullname" . }}

  labels:

    {{- include "mautic.labels" . | nindent 4 }}


spec:

  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}


  selector:

    matchLabels:

      {{- include "mautic.selectorLabels" . | nindent 6 }}


  template:

    metadata:
      labels:

        {{- include "mautic.selectorLabels" . | nindent 8 }}
      
      annotations:
        {{- include "mautic.checksums" . | nindent 8 }}


    spec:

      initContainers:
        # Create dirs on the shared var/ volume as www-data before they're used:
        # PHP doesn't create session.save_path, and kubelet would create a
        # missing subPath dir as root
        - name: prepare-shared-dirs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "mautic.wwwDataSecurityContext" . | nindent 12 }}
          command:
            - mkdir
            - -p
            - {{ include "mautic.sessionPath" . | quote }}
            {{- if .Values.grapesjsAssets.enabled }}
            - {{ printf "/var/www/html/var/%s" (include "mautic.grapesjsSubPath" .) | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: mautic-data
              mountPath: /var/www/html/var

      containers:

        - name: mautic

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: {{ include "mautic.fullname" . }}-config

          env:
            {{- include "mautic.secretEnv" . | nindent 12 }}
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_web
                        
          volumeMounts:
            - name: mautic-media
              mountPath: /var/www/html/docroot/media

            - name: mautic-config
              mountPath: /var/www/html/config
            
            - name: mautic-data
              mountPath: /var/www/html/var

            - name: php-opcache
              mountPath: /usr/local/etc/php/conf.d/opcache.ini
              subPath: opcache.ini

            - name: php-session
              mountPath: /usr/local/etc/php/conf.d/zz-session.ini
              subPath: session.ini

            {{- if .Values.grapesjsAssets.enabled }}
            # Filled by the grapesjs-assets job (image lacks the compiled builder)
            - name: mautic-data
              mountPath: /var/www/html/docroot/plugins/GrapesJsBuilderBundle/Assets/library/js/dist
              subPath: {{ include "mautic.grapesjsSubPath" . }}
              readOnly: true
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5

      volumes:
        - name: mautic-media
          persistentVolumeClaim:
            claimName: {{ include "mautic.mediaPVC" . }}

        - name: mautic-config
          persistentVolumeClaim:
            claimName: {{ include "mautic.configPVC" . }}
        
        - name: mautic-data
          persistentVolumeClaim:
            claimName: {{ include "mautic.dataPVC" . }}
        
        - name: php-opcache
          configMap:
            name: {{ include "mautic.fullname" . }}-php-opcache

        - name: php-session
          configMap:
            name: {{ include "mautic.fullname" . }}-php-session