{{- if .Values.worker.enabled }}
# Symfony Messenger consumers (email, hit, failed), using the image's
# built-in mautic_worker role. Only needed when a queue transport is
# configured; with the default sync:// transport messages never queue.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "mautic.fullname" . }}-worker
  labels:
    {{- include "mautic.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker

spec:
  replicas: {{ .Values.worker.replicas }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mautic.name" . }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      # Must not match mautic.selectorLabels, or the Service routes traffic to this pod
      labels:
        app.kubernetes.io/name: {{ include "mautic.name" . }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
      annotations:
        {{- include "mautic.checksums" . | nindent 8 }}

    spec:
      containers:
        - name: mautic-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: {{ include "mautic.fullname" . }}-config

          env:
            {{- include "mautic.secretEnv" . | nindent 12 }}
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_worker
            - name: DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL
              value: {{ .Values.worker.consumers.email | quote }}
            - name: DOCKER_MAUTIC_WORKERS_CONSUME_HIT
              value: {{ .Values.worker.consumers.hit | quote }}
            - name: DOCKER_MAUTIC_WORKERS_CONSUME_FAILED
              value: {{ .Values.worker.consumers.failed | quote }}

          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}

          volumeMounts:
            - name: mautic-media
              mountPath: /var/www/html/docroot/media
            # The image declares VOLUMEs for these; mount them explicitly or the
            # container runtime shadows them with per-pod local dirs
            - name: mautic-media
              mountPath: /var/www/html/docroot/media/images
              subPath: images
            - name: mautic-media
              mountPath: /var/www/html/docroot/media/files
              subPath: files
            - name: mautic-config
              mountPath: /var/www/html/config
            - name: mautic-data
              mountPath: /var/www/html/var
            - name: mautic-data
              mountPath: /var/www/html/var/logs
              subPath: logs

      volumes:
        - name: mautic-media
          persistentVolumeClaim:
            claimName: {{ include "mautic.mediaPVC" . }}
        - name: mautic-config
          persistentVolumeClaim:
            claimName: {{ include "mautic.configPVC" . }}
        - name: mautic-data
          persistentVolumeClaim:
            claimName: {{ include "mautic.dataPVC" . }}
{{- end }}
