replicaCount: 2

image:
  repository: mautic/mautic
  tag: "7.2.1-apache"
  pullPolicy: IfNotPresent

mautic:
  trustedProxies:
    - 127.0.0.1
    - 10.42.0.0/16
    - 192.168.3.0/24
    - 192.168.0.0/24
    - REMOTE_ADDR
  trustedHosts:
    - mautic.wachtell.net

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  
ingressRoute:
  enabled: true
  entryPoints:
    - websecure
  annotations:
    kubernetes.io/ingress.class: traefik-external
  host: mautic.wachtell.net
  tls:
    enabled: true
    secretName: wachtell-net-tls

  # Admin paths behind authentik. Matched as /x, /x/... and /index.php/x/...
  protectedPaths:
    - s
    - api
    - oauth
  # Always 403
  blockedPaths:
    - installer
  # Per client IP on /form/submit
  formRateLimit:
    average: 10
    period: 1m
    burst: 20
  # Header carrying the real client IP (set by Cloudflare); "" to use the peer IP
  clientIpHeader: CF-Connecting-IP

authentik:
  # Forward-auth for ingressRoute.protectedPaths via the authentik outpost
  enabled: true
  outpost:
    host: ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local
    port: 9000

cloudflare:
  # Site is served through Cloudflare's proxy: trust its edges as proxies
  # https://www.cloudflare.com/ips/ (fetched 2026-10-05)
  enabled: true
  ipRanges:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32

backup:
  # Nightly mariadb-dump of the Mautic DB to its own PVC
  enabled: true
  schedule: "30 2 * * *"
  retentionDays: 14
  storageClass: longhorn
  size: 10Gi
  # Defaults to mariadb.image (provides mariadb-dump)
  image: ""

persistence:
  enabled: true
  createPVC: true

  storageClass: longhorn
  accessMode: ReadWriteMany

  size:
    media: 20Gi
    config: 5Gi
    data: 10Gi

  mediaClaim: ""
  configClaim: ""
  dataClaim: ""

assets:
  build:
    enabled: true
  
# Web pods idle at ~160Mi; a single heavy PHP request may use up to
# memory_limit (512M), so leave headroom for a few concurrent ones.
# The HPA scales on CPU relative to the request (75% of 500m).
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 2Gi

serviceAccount:
  create: true
  name: ""

env:
  DOCKER_MAUTIC_ROLE: mautic_web

mariadb:
  # MariaDB from the official image (templates/mariadb.yaml). Passwords:
  # mariadb.auth.password / rootPassword in values-secret.yaml.
  enabled: true
  image: docker.io/library/mariadb:11.8.9
  replicas: 1
  auth:
    database: mautic
    username: mautic
  persistence:
    # Volume created by the former Bitnami chart; it keeps the data in data/
    existingClaim: data-mautic-mariadb-0
    subPath: data
    storageClass: longhorn
    size: 20Gi
  # Appended to the official image's config (/etc/mysql/conf.d/zz-mautic.cnf).
  # Same server settings as under the Bitnami chart, minus its paths.
  configuration: |
    [mariadb]
    skip-name-resolve
    explicit_defaults_for_timestamp
    max_allowed_packet=16M
    character-set-server=UTF8
    collation-server=utf8_general_ci
    # Mautic tuning
    innodb_buffer_pool_size=2G
    max_connections=200
    table_open_cache=4000
    tmp_table_size=64M
    max_heap_table_size=64M

    [client]
    default-character-set=UTF8
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "6Gi"

cron:
  enabled: true

  # Console commands are short-lived; don't reserve web-pod sized resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  jobs:

    - name: segments-update
      schedule: "*/15 * * * *"
      command: mautic:segments:update

    - name: campaigns-update
      schedule: "*/15 * * * *"
      command: mautic:campaigns:update

    - name: campaigns-trigger
      schedule: "*/5 * * * *"
      command: mautic:campaigns:trigger

    - name: messages-send
      schedule: "* * * * *"
      command: mautic:messages:send

    - name: broadcasts-send
      schedule: "* * * * *"
      command: mautic:broadcasts:send

    - name: cleanup
      schedule: "0 3 * * *"
      command: mautic:maintenance:cleanup

    - name: email-fetch
      schedule: "*/5 * * * *"
      command: mautic:email:fetch
      
worker:
  # Messenger consumers. Enable only if Mautic queues messages
  # (Configuration > Queue settings uses a non-sync transport).
  enabled: false
  replicas: 1
  consumers:
    email: 2
    hit: 2
    failed: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

grapesjsAssets:
  # Official 7.2.x images lack the compiled GrapesJS email builder
  # (mautic/docker-mautic#479). Fetch it from the release ZIP matching the
  # image version. Update version + sha256 together with image.tag; disable
  # once the image ships the assets again.
  enabled: true
  version: "7.2.1"
  sha256: 5c86cf1fe8b4f9818232ce8bb755760f502d47846706e9164d144865d031ecbd

migrations:
  # Run Doctrine migrations once per upgrade in a pre-upgrade hook Job instead
  # of in every web pod's entrypoint (concurrent runs race)
  enabled: true
  timeoutSeconds: 900

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false