replicaCount: 2

image:
  repository: mautic/mautic
  tag: "7.2.1-apache"
  pullPolicy: IfNotPresent

mautic:
  trustedProxies:
    - 127.0.0.1
    - REMOTE_ADDR

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik

  hostname: mautic.wachtell.net

  tls:
    enabled: true
    secretName: mautic-tls

ingressRoute:
  enabled: true
  entryPoints:
    - websecure
  host: mautic.wachtell.net
  tls:
    enabled: true
    secretName: wachtell-net-tls

  middlewares: []
  annotations: {}

persistence:
  enabled: true
  createPVC: true

  storageClass: longhorn
  accessMode: ReadWriteMany

  size:
    media: 20Gi
    config: 5Gi
    data: 10Gi

  mediaClaim: ""
  configClaim: ""
  dataClaim: ""
  
resources:

  requests:
    cpu: 500m
    memory: 1Gi

  limits:
    cpu: 2
    memory: 2Gi

serviceAccount:
  create: true
  name: ""


mariadb:

  enabled: true

  auth:
    database: mautic
    username: mautic
    
  primary:

    persistence:
      enabled: true
      storageClass: longhorn
      size: 20Gi


redis:

  enabled: true

  architecture: standalone

  auth:
    enabled: true

  master:

    persistence:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 5Gi
cron:

  enabled: true

  # Console commands are short-lived; don't reserve web-pod sized resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi


  jobs:


    - name: segments-update

      schedule: "*/15 * * * *"

      command: mautic:segments:update



    - name: campaigns-update

      schedule: "*/15 * * * *"

      command: mautic:campaigns:update



    - name: campaigns-trigger

      schedule: "*/5 * * * *"

      command: mautic:campaigns:trigger



    - name: emails-send

      schedule: "* * * * *"

      command: mautic:emails:send



    - name: broadcasts-send

      schedule: "* * * * *"

      command: mautic:broadcasts:send



    - name: cleanup

      schedule: "0 3 * * *"

      command: mautic:maintenance:cleanup

assets:
  build:
    enabled: false

worker:
  # Messenger consumers. Enable only if Mautic queues messages
  # (Configuration > Queue settings uses a non-sync transport).
  enabled: false
  replicas: 1
  consumers:
    email: 2
    hit: 2
    failed: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

autoscaling:

  enabled: true

  minReplicas: 2

  maxReplicas: 5

  targetCPUUtilizationPercentage: 75

pdb:

  enabled: true

  minAvailable: 1

networkPolicy:

  enabled: false